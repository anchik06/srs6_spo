<div class="card card-body mb-3">
    <div class="filters">
        <input id="search" class="form-control" type="search" placeholder="Найти идею или категорию…" aria-label="Поиск проектов">
        {% if section == 'collection' %}
        <select id="status-filter" class="form-select" aria-label="Фильтр статуса">
            <option value="all">Все статусы</option>
            {% for value, label in status_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
        {% endif %}
        <label class="form-check mb-0"><input id="favorite-filter" class="form-check-input" type="checkbox"><span class="form-check-label">Избранное</span></label>
    </div>
</div>
